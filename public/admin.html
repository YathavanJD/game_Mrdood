<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f0d0b">
<title>Mr.DooD Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@600;800&display=swap">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body>
<section id="login" hidden>
  <form class="login-card" id="f-login">
    <div class="brand"><span class="mark">D</span><b>Mr.DooD</b><small>Game control</small></div>
    <label for="l-user">Username</label><input id="l-user" autocomplete="username" required>
    <label for="l-pass">Password</label><input id="l-pass" type="password" autocomplete="current-password" required>
    <p class="err" id="l-err" role="alert"></p>
    <button class="btn primary wide" type="submit">Sign in</button>
  </form>
</section>
<div id="shell" hidden>
  <aside id="side" aria-label="Main navigation">
    <div class="brand"><span class="mark">D</span><b>Mr.DooD</b><small>Game control</small></div>
    <nav id="nav"></nav>
    <div class="side-foot"><div id="who"></div><button class="btn ghost sm" id="b-logout">Sign out</button></div>
  </aside>
  <div id="scrim"></div>
  <div id="main">
    <header class="top">
      <button class="icon-btn" id="b-menu" aria-label="Toggle menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h1 id="v-title"></h1>
      <span class="pill" id="game-pill"></span>
      <span class="live" id="live-dot" title="Live connection"></span>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="modal" hidden></div>
<div id="toasts" aria-live="polite"></div>
<script src="/assets/admin.js"></script>
</body>
</html>
